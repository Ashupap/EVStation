name: smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # nightly UTC

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pnpm install --frozen-lockfile
      - name: Start dev stack
        run: pnpm dev:stack
      - name: Health check
        run: pnpm health
      - name: Pin the simulator's dependencies
        run: python3 -m venv .venv && .venv/bin/pip install -r tools/simulator/requirements.txt
      - name: Smoke test (fresh volumes)
        run: pnpm smoke
      - name: Smoke test (rerun without cleanup proves idempotency)
        run: pnpm smoke
      - name: Production-like OCPP station policy
        run: pnpm test:ocpp:production-like
      - name: Prepare Phase 1 database
        run: pnpm db:migrate && pnpm db:seed
      - name: Install dashboard browser
        run: pnpm --filter @evstation/dashboard exec playwright install --with-deps chromium
      - name: Real Keycloak + API dashboard E2E
        run: pnpm --filter @evstation/dashboard test:e2e:real
      - name: Collect artifacts on failure
        if: failure()
        run: |
          docker ps -a > smoke-docker-ps.txt || true
          docker logs evstation-citrine-1 > smoke-citrine.log 2>&1 || true
          docker logs evstation-graphql-engine-1 > smoke-hasura.log 2>&1 || true
          pnpm health > smoke-health.txt || true
          docker logs evstation-keycloak-1 > smoke-keycloak.log 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-failure-artifacts
          path: smoke-*
